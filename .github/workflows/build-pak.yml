name: Build PUBG Lua Mod Pak

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'mod/**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch repak
        run: |
          wget -q https://github.com/trumank/repak/releases/download/v0.2.2/repak_cli-x86_64-unknown-linux-gnu.zip
          unzip -q repak_cli-x86_64-unknown-linux-gnu.zip
          chmod +x repak
          ./repak --version

      - name: Pack mod into pak
        run: |
          ./repak pack --version 4 mod/ pakchunk9999-Android_etc_P.pak

      - name: Verify pak
        run: |
          ls -lh pakchunk9999-Android_etc_P.pak
          ./repak list pakchunk9999-Android_etc_P.pak

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-lua-mod-pak
          path: pakchunk9999-Android_etc_P.pak
          retention-days: 7
